name: Infrastructure Compliance Gate

on:
  pull_request:
    paths:
      - '**.tf'
      - 'policy/**.rego'

jobs:
  policy-gate:
    name: OPA Policy Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          wget -q https://github.com/open-policy-agent/conftest/releases/download/v0.45.0/conftest_0.45.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.45.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Use committed plan.json for policy evaluation
        run: conftest test plan.json --policy ./policy/
